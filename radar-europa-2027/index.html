<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Europa 2027</title><style>body{background:#0e1727;color:#f8fafc;font:16px system-ui;margin:0}main{max-width:950px;margin:auto;padding:35px}h1{font-size:2.3rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#1e304c;padding:22px;border-radius:15px}.price{color:#8bf0b4;font-size:1.8rem}small{color:#b7c8d9}</style><main><h1>✈ Radar Europa 2027</h1><p>Passagens saindo de Salvador (SSA) · Fevereiro/março e julho/agosto de 2027</p><p id="status">Aguardando consulta de preços reais. Nenhuma oferta confirmada.</p><div class="cards" id="cards"></div><small>Os preços exibidos somente aparecerão após atualização verificada da fonte de dados.</small></main><script>fetch('./data.json?t='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('status').textContent=d.updated_at?'Última consulta: '+new Date(d.updated_at).toLocaleString('pt-BR'):'Aguardando consulta de preços reais. Nenhuma oferta confirmada.';document.getElementById('cards').innerHTML=(d.offers||[]).map(o=>'<article class="card"><b>'+o.destination+'</b><div class="price">R$ '+Number(o.price).toLocaleString('pt-BR',{minimumFractionDigits:2})+'</div><p>'+o.departure+' → '+o.return+'</p></article>').join('')}).catch(()=>document.getElementById('status').textContent='Dados indisponíveis no momento.')</script></html>
